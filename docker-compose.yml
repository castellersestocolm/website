version: "3.9"

services:
  backend:
    image: backend
    build:
      context: backend
      args:
        - BUILD_TARGET=dev
    stdin_open: true
    tty: true
    restart: on-failure
    entrypoint: ["wait-for-it", "database:5432", "--", "python", "manage.py"]
    command: ["runserver", "0.0.0.0:8000"]
    networks:
      - comunicat
    volumes:
      - ./backend/src:/backend/src:cached
      - ./backend/requirements:/backend/requirements:cached
      - ./backend/Makefile:/backend/Makefile:cached
      - ./backend/setup.cfg:/backend/setup.cfg:cached
      - ./backend/media:/backend/media:cached
      - ./backend/media-private:/backend/media-private:cached
      - internal-media:/backend/internal_media:cached
    ports:
      - target: 8000
        published: 8000
        protocol: tcp
        mode: host
    depends_on:
      - database
      - redis
    env_file:
      - ./envs/local.env
  database:
    image: postgres:17.2
    ports:
      - 5432:5432
    networks:
      - comunicat
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      DJANGO_WATCHMAN_TIMEOUT: 20
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: comunicat
      POSTGRES_PASSWORD: comunicat
      POSTGRES_DB: comunicat
  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    ports:
      - 6390:6379
    networks:
      - comunicat
  worker:
    image: backend
    stdin_open: true
    tty: true
    entrypoint: [ "celery" ]
    command: [ "-A", "comunicat", "worker", "-Q", "default" ]
    depends_on:
      - redis
      - database
    volumes:
      - ./backend/src:/backend/src:cached
      - ./backend/media:/backend/media:cached
      - ./backend/media-private:/backend/media-private:cached
      - internal-media:/backend/internal_media:cached
    networks:
      - comunicat
    env_file:
      - ./envs/local.env
  beat:
    image: backend
    entrypoint: [ "celery" ]
    command:
      [ "-A", "comunicat", "beat", "--pidfile=", "-s", "/data/celerybeat-schedule", "-l", "debug" ]
    depends_on:
      - worker
    volumes:
      - celerybeat-data:/data
      - ./backend:/backend/backend:cached
    networks:
      - comunicat
    env_file:
      - ./envs/local.env
  maildev:
    image: djfarrelly/maildev
    networks:
      - comunicat
    ports:
      - 1080:80

volumes:
  internal-media:
  postgres-data:
  redis-data:
  celerybeat-data:

networks:
  comunicat:
    ipam:
      config:
        - subnet: 172.24.0.0/16
